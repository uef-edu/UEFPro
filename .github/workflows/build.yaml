name: Build and check fonts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ttfautohint
          python -m pip install --upgrade pip
          pip install gftools fontbakery
      - name: Build fonts
        run: cd sources && gftools builder config.yaml
      - name: Fontbakery (universal profile)
        run: |
          mkdir -p out
          fontbakery check-universal --no-progress -l WARN \
            --html out/fontbakery-static.html fonts/ttf/*.ttf || true
          fontbakery check-universal --no-progress -l WARN \
            --html out/fontbakery-variable.html fonts/variable/*.ttf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fontbakery-reports
          path: out
